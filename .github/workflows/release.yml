name: Build plugin zip

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, for example v1.0.2. Leave empty to only build the zip.
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: ./bin/build-zip.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-support-chat-widget-by-brane
          path: dist/free-support-chat-widget-by-brane.zip

      # Pushing a v* tag, or running this by hand with a version, publishes the
      # release with the zip attached.
      - name: Create the release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          gh release create "$TAG" dist/free-support-chat-widget-by-brane.zip \
            --target "${{ github.sha }}" \
            --title "Free Support Chat Widget by Brane $TAG" \
            --notes "Download free-support-chat-widget-by-brane.zip below, then in WordPress go to Plugins > Add New Plugin > Upload Plugin."

      # A release published by hand gets the zip attached.
      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/free-support-chat-widget-by-brane.zip --clobber
