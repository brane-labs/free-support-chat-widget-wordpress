name: Build plugin zip

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build zip
        run: ./bin/build-zip.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-support-chat-widget-by-brane
          path: dist/free-support-chat-widget-by-brane.zip

      # Pushing a v* tag publishes the release, with the zip attached.
      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/free-support-chat-widget-by-brane.zip \
            --title "Free Support Chat Widget by Brane ${{ github.ref_name }}" \
            --notes "Download free-support-chat-widget-by-brane.zip below, then in WordPress go to Plugins > Add New Plugin > Upload Plugin."

      # A release published by hand gets the zip attached.
      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/free-support-chat-widget-by-brane.zip --clobber
